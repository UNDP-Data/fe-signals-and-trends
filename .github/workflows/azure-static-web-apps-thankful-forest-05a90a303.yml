name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - production
      - staging
      - dev
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - production
      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      VITE_API_BASEURL: ${{ github.ref == 'refs/heads/production' && secrets.VITE_API_BASEURL_PRODUCTION || secrets.VITE_API_BASEURL_STAGING }}
      VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
      VITE_AUTHORITY: ${{ secrets.VITE_AUTHORITY }}
      VITE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_FOR_MSAL }}
      VITE_PEXEL_API_KEY: ${{ secrets.VITE_PEXEL_API_KEY }}
      VITE_WORLD_NEWS_API_KEY: ${{ secrets.VITE_WORLD_NEWS_API_KEY }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_FOREST_05A90A303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "build"
          production_branch: "production"
          access_token_for_api: ${{ secrets.ACCESS_CODE_FOR_API }}
          redirect_uri_for_msal: ${{ secrets.REDIRECT_URI_FOR_MSAL }}
          client_secret_for_msal: ${{ secrets.CLIENT_SECRET_FOR_MSAL }}
          app_build_command: "npm run build"
          app_settings: '{"VITE_PEXEL_API_KEY":"${{ secrets.VITE_PEXEL_API_KEY }}","VITE_WORLD_NEWS_API_KEY":"${{ secrets.VITE_WORLD_NEWS_API_KEY }}"}'
