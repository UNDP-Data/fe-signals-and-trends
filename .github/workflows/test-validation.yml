name: Test Validation

on:
  push:
    branches:
      - staging
      - production
  pull_request:
    branches:
      - staging
      - production

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    env:
      VITE_API_BASEURL: ${{ github.ref == 'refs/heads/production' && secrets.VITE_API_BASEURL_PRODUCTION || secrets.VITE_API_BASEURL_STAGING }}
      VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
      VITE_AUTHORITY: ${{ secrets.VITE_AUTHORITY }}
      VITE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_FOR_MSAL }}
      VITE_WORLD_NEWS_API_KEY: ${{ secrets.VITE_WORLD_NEWS_API_KEY }}
      VITE_PEXEL_API_KEY: ${{ secrets.VITE_PEXEL_API_KEY }}
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          CI: true

      # Optional: Add test coverage reporting
      - name: Generate test coverage
        run: npm run test -- --coverage

      # Add failure conditions based on coverage thresholds
      - name: Check test coverage
        run: |
          COVERAGE=$(npm run test -- --coverage --coverageReporters="json-summary" | grep "All files" | awk '{print $4}' | cut -d'%' -f1)
          if [ "$COVERAGE" -lt 70 ]; then
            echo "Test coverage is below 70%"
            exit 1
          fi

  # This job ensures all tests pass before allowing deployment
  validate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Validation successful
        run: echo "All tests passed successfully!" 